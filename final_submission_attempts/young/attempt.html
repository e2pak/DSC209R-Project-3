<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CO2 emissions by country through the years</title>
    <link rel="stylesheet" href="attempt.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  </head>
  <body>
    <header>
      <h1>CO2 emissions by country through the years</h1>
      <p id="map-blurb">
        Country color shows each economy’s total CO₂ emissions in the selected
        year, summed across industries.
      </p>
    </header>

    <div id="map">
      <p id="status">Loading map…</p>
      <aside id="legend" hidden>
        <p id="legend-title">Total emissions</p>
        <p id="legend-mode" class="hint">Absolute</p>
        <div id="ramp"></div>
        <div class="ramp-labels">
          <span id="ramp-low">Lower</span>
          <span id="ramp-high">Higher</span>
        </div>
      </aside>
    </div>

    <footer>
      <label class="control-field industry-field" for="industry">
        Industry
        <select id="industry" aria-label="Industry">
          <option value="ALL" selected>ALL</option>
        </select>
      </label>

      <fieldset class="control-field scale-field">
        <legend>Scale</legend>
        <div class="scale-controls">
          <div class="scale-row" role="radiogroup" aria-label="Color scale mode">
            <label class="scale-option">
              <input type="radio" name="scale-mode" value="absolute" checked />
              Absolute
            </label>
            <label class="scale-option">
              <input type="radio" name="scale-mode" value="relative" />
              Relative
            </label>
          </div>
          <label class="log-option" for="log-scale">
            <input id="log-scale" type="checkbox" />
            Log
          </label>
        </div>
      </fieldset>

      <label class="control-field year-field" for="year">
        Year
        <span class="year-row">
          <span class="endpoint">1995</span>
          <input
            id="year"
            type="range"
            min="1995"
            max="2018"
            value="2018"
            step="1"
            aria-valuemin="1995"
            aria-valuemax="2018"
            aria-valuenow="2018"
          />
          <span class="endpoint">2018</span>
          <strong id="year-label">2018</strong>
        </span>
      </label>

      <div class="play-wrap">
        <button id="play" type="button">Play</button>
      </div>
    </footer>

    <div id="hover-card" role="tooltip" aria-hidden="true">
      <div class="card-head">
        <strong id="card-name"></strong>
        <span id="card-total"></span>
      </div>
      <div class="card-body">
        <div>
          <p class="panel-title">Top industry</p>
          <svg id="industry-chart"></svg>
        </div>
        <div class="avg-panel">
          <p class="unit">Avg. CO2 emissions, Metric ton of CO₂</p>
          <p class="value" id="card-avg"></p>
        </div>
      </div>
    </div>

    <script src="attempt.js"></script>
  </body>
</html>
